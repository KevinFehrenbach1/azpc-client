name: Build AZPC Launcher
on:
  workflow_dispatch:
  push:
    branches: [main, launcher/forever-v0.2.3]
    paths:
      - 'launcher/**'
      - 'addons/forever/AZPCForever/**'
      - 'watcher/tests/**'
      - 'installer/payload/**'
      - '.github/workflows/build-azpc-launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'watcher/tests/**'
      - 'installer/payload/**'
      - '.github/workflows/build-azpc-launcher.yml'
permissions:
  contents: read
jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 watcher/tests/forever-settings.lua
      - run: lua5.1 watcher/tests/forever-minimap.lua
      - run: lua5.1 watcher/tests/forever-setup.lua
      - run: lua5.1 watcher/tests/forever-sync-status.lua
      - run: lua5.1 watcher/tests/forever-addon.lua
      - run: lua5.1 watcher/tests/forever-tooltips.lua
      - run: lua5.1 watcher/tests/forever-profession.lua
      - run: lua5.1 watcher/tests/forever-reload-prompt.lua
      - run: lua5.1 watcher/tests/forever-reload-integration.lua
      - run: lua5.1 watcher/tests/forever-crafting.lua
      - run: lua5.1 watcher/tests/forever-disenchant.lua
      - run: lua5.1 watcher/tests/forever-disenchant-integration.lua
      - run: lua5.1 watcher/tests/forever-mail-reload.lua
      - run: lua5.1 watcher/tests/forever-costing.lua
      - run: lua5.1 watcher/tests/forever-performance.lua
      - run: lua5.1 watcher/tests/forever-diagnostics.lua
      - run: lua5.1 watcher/tests/forever-staged-costing.lua
      - run: lua5.1 watcher/tests/forever-staged-parity.lua
      - run: lua5.1 watcher/tests/forever-vendor.lua
      - run: lua5.1 watcher/tests/forever-sync.lua
      - run: lua5.1 watcher/tests/forever-materials.lua
      - run: lua5.1 watcher/tests/forever-migrations.lua
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, updates, rollback, and history preservation
        shell: powershell
        run: ./launcher/tests/Run.Tests.ps1
      - name: Check automatic data migration, backups and evidence guards
        shell: powershell
        run: ./launcher/tests/Repair.Tests.ps1
      - name: Check read-only addon sync status
        shell: powershell
        run: ./watcher/tests/SyncStatus.Tests.ps1
      - name: Check Forever crafting upload and retry handling
        shell: powershell
        run: ./watcher/tests/Crafting.Tests.ps1
      - name: Check Forever scan queue and upload retries
        shell: powershell
        run: ./watcher/tests/Run.Tests.ps1
      - name: Check material source round-trip sync
        shell: powershell
        run: ./watcher/tests/Materials.Tests.ps1
      - name: Build launcher and update bundle
        shell: powershell
        run: ./launcher/Build.ps1
      - name: Verify newly built component manifests and checksums
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = './launcher/output'
          foreach ($game in @('forever','tbc')) {
            $prefix = if ($game -eq 'forever') { 'azpc-forever-' } else { 'azpc-' }
            $manifest = Get-Content (Join-Path $out ($prefix+'update.json')) -Raw | ConvertFrom-Json
            $bundle = Join-Path $out ($prefix+'components.zip')
            $actual = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $manifest.bundleSha256) { throw ('Packaged '+$game+' checksum mismatch') }
            if ($game -eq 'forever') {
              $expected = (Get-Content './installer/payload/VERSION.json' -Raw | ConvertFrom-Json).foreverAddonVersion
              if ($manifest.addonVersion -ne $expected) { throw 'Forever release manifest version mismatch' }
            }
            Write-Host ('PASS: '+$game+' package checksum and version '+$manifest.addonVersion)
          }
      - name: Smoke test launcher window
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'azpc-ui-smoke'
          New-Item -ItemType Directory $env:LOCALAPPDATA -Force | Out-Null
          $script = (Resolve-Path './launcher/dist/launcher/AZPC-Launcher.ps1').Path
          foreach ($page in @('Overview','Updates','Settings','Forever')) {
            $stdout = Join-Path $env:RUNNER_TEMP ('launcher-'+$page+'-stdout.txt')
            $stderr = Join-Path $env:RUNNER_TEMP ('launcher-'+$page+'-stderr.txt')
            $p = Start-Process powershell.exe -ArgumentList @('-NoProfile','-STA','-ExecutionPolicy','Bypass','-File',('"'+$script+'"'),'-PreviewPage',$(if($page -eq 'Forever'){'Updates'}else{$page}),'-PreviewGame',$(if($page -eq 'Forever'){'forever'}else{'tbc-anniversary'})) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 8
            if ($p.HasExited) { Get-Content $stdout,$stderr; throw ('Launcher exited on '+$page) }
            try {
              Add-Type -AssemblyName System.Drawing,System.Windows.Forms
              $screen = [Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object Drawing.Bitmap($screen.Width,$screen.Height)
              $graphics = [Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($screen.Location,[Drawing.Point]::Empty,$screen.Size)
              $bitmap.Save((Join-Path (Resolve-Path './launcher/output') ('launcher-'+$page+'.png')))
              $graphics.Dispose(); $bitmap.Dispose()
            } finally { Stop-Process -Id $p.Id -Force }
            if ((Get-Item $stderr).Length -gt 0) { Get-Content $stderr; throw ('UI errors on '+$page) }
          }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build per-user installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' './launcher/AZPC-Launcher-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          Get-FileHash ./launcher/output/AZPC-Launcher-Setup.exe -Algorithm SHA256
      - name: Verify installed EXE opens a visible launcher window
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'AZPC installed test'
          $setup = (Resolve-Path './launcher/output/AZPC-Launcher-Setup.exe').Path
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$destination+'"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed.' }
          $exe = Join-Path $destination 'AZPC-Launcher.exe'
          $p = Start-Process $exe -PassThru
          try {
            $visible = $null
            for ($attempt=0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw ('Installed launcher exited with code '+$p.ExitCode) }
              $children = @(Get-CimInstance Win32_Process -Filter ('ParentProcessId = '+$p.Id))
              foreach ($child in $children) {
                $gui = Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
                if ($gui -and $gui.MainWindowHandle -ne 0 -and $gui.MainWindowTitle -eq 'AZPC Launcher') { $visible=$gui }
              }
              if ($visible) { break }
            }
            if (-not $visible) { throw 'Installed EXE did not open a visible AZPC window.' }
            Write-Host 'PASS: installed EXE opens a visible AZPC launcher window.'
          } finally {
            Get-CimInstance Win32_Process -Filter ('ParentProcessId = '+$p.Id) | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: AZPC-Launcher-0.2.21-Windows-TEST
          path: launcher/output/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, addon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AZPC-Launcher-0.2.21-Windows-TEST
          path: release
      - name: Publish launcher and both game packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^## Version: *//p' addons/forever/AZPCForever/AZPCForever.toc | tr -d '\r')"
          tag="forever-addon-v${version}"
          test "$(python -c 'import json; print(json.load(open("installer/payload/VERSION.json"))["foreverAddonVersion"])')" = "$version"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists"; exit 0; fi
          gh release create "$tag" release/AZPC-Launcher-Setup.exe release/AZPC-Launcher-Portable.zip release/azpc-components.zip release/azpc-update.json release/azpc-forever-components.zip release/azpc-forever-update.json --target "$GITHUB_SHA" --latest --title "AZPC Forever addon ${version}" --notes "Fix crafting CSV export nil-function crash and improve watcher reliability diagnostics."
