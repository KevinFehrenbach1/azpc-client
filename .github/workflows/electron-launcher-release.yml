name: Electron launcher release
on:
  workflow_dispatch:
  push:
    tags: ['launcher-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovered source
        shell: pwsh
        run: |
          $required = @('main.js','renderer.js','preload.js','game-detection.js','index.html','assets/azpc-account-logo.png')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing launcher source: $file" }
          }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '1.0.31') { throw 'Expected launcher version 1.0.31' }
          if ((Get-Content game-detection.js -Raw) -notmatch "_forever_") { throw 'Live game folder missing' }
          if ((Get-Content index.html -Raw) -match 'Forever Beta') { throw 'Beta label remains' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main.js
          node --check renderer.js
          node --check preload.js
          node --check game-detection.js
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AZPC-Launcher-v1.0.31-Windows
          path: launcher-electron/dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        working-directory: .
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -ne 'launcher-v1.0.31') { throw "Unexpected launcher tag $tag" }
          gh release create $tag launcher-electron/dist/*.exe --title "AZPC Launcher v1.0.31" --notes "Forever Live replaces Forever Beta and detects the _forever_ game installation." --verify-tag
