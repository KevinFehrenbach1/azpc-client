name: Build Approved AZPC Desktop Launcher
on:
  workflow_dispatch:
  push:
    branches: [launcher/approved-electron-ui]
    paths:
      - 'launcher-next/**'
      - '.github/workflows/build-approved-launcher.yml'
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved launcher source
        shell: pwsh
        run: |
          foreach ($file in @('package.json','main.js','preload.js','renderer.js','index.html')) {
            if (-not (Test-Path (Join-Path launcher-next $file))) { throw "Missing required launcher source: $file" }
          }
      - name: Install dependencies
        working-directory: launcher-next
        run: npm install --no-audit --no-fund
      - name: Generate AZPC Windows icon
        working-directory: launcher-next
        run: npm run make-icon
      - name: Build Windows installer
        working-directory: launcher-next
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
        run: npx electron-builder --win nsis --publish never
      - name: Upload downloadable Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AZPC-Approved-Launcher-Windows
          path: |
            launcher-next/dist/*.exe
            launcher-next/dist/latest.yml
          if-no-files-found: error

      - name: Publish dedicated launcher release (versioned)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content launcher-next/package.json | ConvertFrom-Json).version
          $tag = "launcher-v$version"
          $installer = Get-ChildItem launcher-next/dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer to publish' }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Launcher release $tag already exists. Skipping."
            exit 0
          }
          gh release create $tag $installer.FullName --target "${{ github.sha }}" --title "AZPC Launcher v$version" --notes "Versioned Windows launcher installer for in-app updates."
